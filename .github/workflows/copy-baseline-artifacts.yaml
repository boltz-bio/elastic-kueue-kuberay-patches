# Copy exact baseline OCI objects to the organization and verify immutable content and public access without rebuilding.

name: Copy Baseline Artifacts

on:
  push:
    branches: [fix-publication-ownership]
    paths: [.github/workflows/copy-baseline-artifacts.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copy:
    if: github.repository == 'boltz-bio/elastic-kueue-kuberay-patches' && github.ref == 'refs/heads/fix-publication-ownership'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install the checksum-pinned native registry client
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/baseline-tools"
          export DOCKER_CONFIG="${RUNNER_TEMP}/baseline-registry-auth"
          printf 'DOCKER_CONFIG=%s\n' "${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
          mkdir -p "${tools}" "${DOCKER_CONFIG}" "${RUNNER_TEMP}/baseline-anonymous"
          chmod 700 "${DOCKER_CONFIG}"
          printf '{}\n' > "${RUNNER_TEMP}/baseline-anonymous/config.json"
          curl --fail --location --silent --show-error \
            https://github.com/google/go-containerregistry/releases/download/v0.18.0/go-containerregistry_Linux_x86_64.tar.gz \
            --output "${tools}/crane.tar.gz"
          printf '%s  %s\n' cdf4d426d965d9a8ba613d7ebf3addf93101aa2e853a3f08fbfdaed2823918f3 "${tools}/crane.tar.gz" | sha256sum --check
          tar -xzf "${tools}/crane.tar.gz" -C "${tools}" crane
          "${tools}/crane" version
          printf '%s\n' "${tools}" >> "${GITHUB_PATH}"

      - name: Authenticate only the destination registry writes
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Copy the exact current Kueue baseline and all child manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          
          DIGEST = "sha256:32a219db46a4dbe87de4953f23ba6cf1a442189c68e00e941cae12933135968a"
          SOURCE = "ghcr.io/simonepri/kueue"
          DESTINATION = "ghcr.io/boltz-bio/kueue"
          TAG = "v0.20.4-p0.10.4"
          proof = {"source_rebuild": False, "digest": DIGEST, "source": SOURCE, "destination": DESTINATION + ":" + TAG, "copies": [], "workflow_sha": os.environ["GITHUB_SHA"]}
          path = Path("baseline-proof/proof.json")
          path.parent.mkdir(exist_ok=True)
          anonymous = {"PATH": os.environ["PATH"], "HOME": os.environ["RUNNER_TEMP"] + "/baseline-anonymous", "DOCKER_CONFIG": os.environ["RUNNER_TEMP"] + "/baseline-anonymous"}
          
          def seal():
              path.write_text(json.dumps(proof, indent=2) + "\n")
          
          def crane(*args, anon=False):
              return subprocess.check_output(["crane", *args], env=anonymous if anon else None)
          
          def manifest(reference, digest, anon=False):
              data = crane("manifest", reference, anon=anon)
              if "sha256:" + hashlib.sha256(data).hexdigest() != digest and data.endswith(b"\n"):
                  data = data[:-1]
              assert "sha256:" + hashlib.sha256(data).hexdigest() == digest, "manifest byte hash mismatch"
              return data, json.loads(data)
          
          def copy(digest, tag):
              source = SOURCE + "@" + digest
              destination = DESTINATION + ":" + tag
              original, value = manifest(source, digest, anon=True)
              for child in value.get("manifests", []):
                  copy(child["digest"], TAG + "-manifest-" + child["digest"].split(":")[1][:16])
              existing = subprocess.run(["crane", "digest", destination], capture_output=True, text=True)
              if existing.returncode == 0:
                  assert existing.stdout.strip() == digest, "existing destination tag has different content"
              else:
                  assert any(code in existing.stderr for code in ("MANIFEST_UNKNOWN", "NAME_UNKNOWN")), "destination lookup failed"
                  subprocess.run(["crane", "copy", "--no-clobber", source, destination], check=True)
              assert crane("digest", destination).decode().strip() == digest
              copied, _ = manifest(destination, digest)
              assert copied == original, "source/destination manifest bytes differ"
              public, _ = manifest(destination, digest, anon=True)
              assert public == original, "anonymous destination differs"
              proof["copies"].append({"source": source, "destination": destination, "digest": digest, "manifest_bytes_equal": True, "public_access": True, "children": value.get("manifests", [])})
              seal()
          
          seal()
          try:
              copy(DIGEST, TAG)
              proof["result"] = "PASS"
          except Exception as error:
              proof["result"] = "FAIL"
              proof["error"] = str(error)
              raise
          finally:
              proof["finished_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              seal()
          PY

      - name: Record scoped package metadata
        if: always()
        run: |
          mkdir -p baseline-proof
          for package in kueue; do
            gh api "orgs/boltz-bio/packages/container/${package}" \
              --jq '{name,visibility,repository:.repository.full_name}' \
              > "baseline-proof/${package}-access.json" || true
          done

      - name: Remove ephemeral registry credentials
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/baseline-registry-auth"

      - name: Retain exact transfer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-copy-proof
          path: baseline-proof
          if-no-files-found: error
