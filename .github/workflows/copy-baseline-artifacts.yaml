# Copy exact baseline OCI objects to the organization and verify immutable content and public access without rebuilding.

name: Copy Baseline Artifacts

on:
  push:
    branches: [fix-publication-ownership]
    paths: [.github/workflows/copy-baseline-artifacts.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copy:
    if: github.repository == 'boltz-bio/elastic-kueue-kuberay-patches' && github.ref == 'refs/heads/fix-publication-ownership'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install the checksum-pinned native registry client
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/baseline-tools"
          export DOCKER_CONFIG="${RUNNER_TEMP}/baseline-registry-auth"
          printf 'DOCKER_CONFIG=%s\n' "${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
          mkdir -p "${tools}" "${DOCKER_CONFIG}" "${RUNNER_TEMP}/baseline-anonymous"
          chmod 700 "${DOCKER_CONFIG}"
          printf '{}\n' > "${RUNNER_TEMP}/baseline-anonymous/config.json"
          curl --fail --location --silent --show-error \
            https://github.com/google/go-containerregistry/releases/download/v0.18.0/go-containerregistry_Linux_x86_64.tar.gz \
            --output "${tools}/crane.tar.gz"
          printf '%s  %s\n' cdf4d426d965d9a8ba613d7ebf3addf93101aa2e853a3f08fbfdaed2823918f3 "${tools}/crane.tar.gz" | sha256sum --check
          tar -xzf "${tools}/crane.tar.gz" -C "${tools}" crane
          "${tools}/crane" version
          printf '%s\n' "${tools}" >> "${GITHUB_PATH}"

      - name: Authenticate only the destination registry writes
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Copy exact immutable manifests and compose their CPU index
        run: |
          set -euo pipefail
          mkdir -p baseline-proof
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          rows = [
              ('ray', '2.60.0-py313-p0.4.3-amd64', '5531a43ac39cb995c513f95b567dab725016be873f9a8bb428045a77b13a0020'),
              ('ray', '2.60.0-py313-p0.4.3-arm64', '17781870951ebbdc08f90173eb9a3514ec4a78128f3c772dc02089cc3d2702ff'),
              ('ray', '2.60.0-py313-cu126-p0.4.3', '3765949650bf7101c933df4f481b9f5a9bca1ae33666daaf89ca2fac416bc5a5'),
              ('ray', '2.60.0-py313-gpu-p0.4.3', '61f8477b298713a20a56dbcc4f3e1ffe469b21273ad31c9c9b9cff8d6079a0da'),
              ('kueue', 'v0.20.4-p0.10.3', '0c5a3c5a75ac95ba0f5ad636db649a1f03f0d3d316445606ef6717844c28ca11'),
              ('kuberay-operator', 'v1.7.1-p0.5.0', '816227c3c0e2ac8e66284f372bcca04508eb0de507b11c435eb5db8ce11ff466'),
          ]
          anonymous = {key: value for key, value in os.environ.items() if key not in {'GH_TOKEN', 'GITHUB_TOKEN'}}
          anonymous['DOCKER_CONFIG'] = os.environ['RUNNER_TEMP'] + '/baseline-anonymous'
          proof = {'source_rebuild': False, 'copies': [], 'copy_errors': [], 'public_access': [], 'public_errors': [], 'repository': os.environ['GITHUB_REPOSITORY'], 'workflow_sha': os.environ['GITHUB_SHA']}
          path = Path('baseline-proof/proof.json')
          def seal():
              path.write_text(json.dumps(proof, indent=2) + '\n')
          def crane(*args, anon=False):
              return subprocess.check_output(['crane', *args], env=anonymous if anon else None, text=True).strip()
          def manifest(reference, digest, *, anon=False):
              data = subprocess.check_output(['crane', 'manifest', reference], env=anonymous if anon else None)
              candidates = [data, data[:-1]] if data.endswith(b'\n') else [data]
              assert any(hashlib.sha256(value).hexdigest() == digest.removeprefix('sha256:') for value in candidates)
              return json.loads(data)
          seal()
          for image, tag, digest in rows:
              source = f'ghcr.io/simonepri/{image}@sha256:{digest}'
              destination = f'ghcr.io/boltz-bio/{image}:{tag}'
              try:
                  assert crane('digest', source, anon=True) == 'sha256:' + digest
                  source_manifest = manifest(source, digest, anon=True)
                  descriptors = source_manifest.get('manifests', [])
                  # Retain each exact platform and attestation manifest through its own named operation.
                  for child in descriptors:
                      child_source = f'ghcr.io/simonepri/{image}@{child["digest"]}'
                      child_destination = f'ghcr.io/boltz-bio/{image}:{tag}-manifest-{child["digest"].split(":")[1][:12]}'
                      original = manifest(child_source, child['digest'], anon=True)
                      subprocess.run(['crane', 'copy', '--no-clobber', child_source, child_destination], check=True)
                      assert crane('digest', child_destination) == child['digest']
                      assert manifest(child_destination, child['digest']) == original
                  subprocess.run(['crane', 'copy', '--no-clobber', source, destination], check=True)
                  assert crane('digest', destination) == 'sha256:' + digest
                  assert manifest(destination, digest) == source_manifest
                  blobs = ([source_manifest['config']['digest'], *[layer['digest'] for layer in source_manifest['layers']]]
                           if 'config' in source_manifest else [])
                  proof['copies'].append({'source': source, 'destination': destination, 'digest': 'sha256:' + digest, 'manifest_equal': True, 'manifest_sha256_verified': True, 'config_and_layers': blobs, 'child_manifests': descriptors})
              except Exception as error:
                  proof['copy_errors'].append({'source': source, 'destination': destination, 'error': str(error)})
              seal()
          first = 'ghcr.io/boltz-bio/ray@sha256:' + rows[0][2]
          second = 'ghcr.io/boltz-bio/ray@sha256:' + rows[1][2]
          cpu = 'ghcr.io/boltz-bio/ray:2.60.0-py313-p0.4.3'
          try:
              existing = subprocess.run(['crane', 'manifest', cpu], capture_output=True, text=True, check=False)
              if existing.returncode:
                  if not any(code in existing.stderr for code in ('MANIFEST_UNKNOWN', 'NAME_UNKNOWN')):
                      raise RuntimeError(existing.stderr)
                  subprocess.run(['crane', 'index', 'append', '--manifest', first, '--manifest', second, '--tag', cpu], check=True)
              # An existing CPU index is read and accepted only with the exact baseline children.
              index_digest = crane('digest', cpu)
              index = manifest(cpu, index_digest)
              assert {item['digest'] for item in index['manifests']} == {'sha256:' + rows[0][2], 'sha256:' + rows[1][2]}
              assert {(item['platform']['os'], item['platform']['architecture']) for item in index['manifests']} == {('linux', 'amd64'), ('linux', 'arm64')}
              proof['cpu_index'] = {'reference': cpu, 'digest': index_digest, 'recomposed': True, 'children': index['manifests'], 'manifest_sha256_verified': True}
          except Exception as error:
              proof['copy_errors'].append({'destination': cpu, 'error': str(error)})
          proof['authenticated_copy_passed'] = not proof['copy_errors'] and len(proof['copies']) == len(rows)
          seal()
          # Visibility is independent of repository permissions. Fail closed until consumers can read anonymously.
          public_rows = [(row['destination'], row['digest']) for row in proof['copies']]
          if 'cpu_index' in proof:
              public_rows.append((cpu, proof['cpu_index']['digest']))
          for destination, digest in public_rows:
              try:
                  assert crane('digest', destination, anon=True) == digest
                  proof['public_access'].append(destination)
              except Exception as error:
                  proof['public_errors'].append({'destination': destination, 'error': str(error)})
              seal()
          proof['result'] = 'FAIL' if proof['copy_errors'] or proof['public_errors'] else 'PASS'
          proof['finished_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          seal()
          raise SystemExit(0 if proof['result'] == 'PASS' else 1)
          PY

      - name: Record scoped package metadata
        if: always()
        run: |
          mkdir -p baseline-proof
          for package in ray kueue kuberay-operator; do
            gh api "orgs/boltz-bio/packages/container/${package}" \
              --jq '{name,visibility,repository:.repository.full_name}' \
              > "baseline-proof/${package}-access.json" || true
          done

      - name: Remove ephemeral registry credentials
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/baseline-registry-auth"

      - name: Retain exact transfer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-copy-proof
          path: baseline-proof
          if-no-files-found: error
