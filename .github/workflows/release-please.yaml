# Create version releases and publish patched images only from a trusted invocation of this repository's main branch.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.repository == 'boltz-bio/elastic-kueue-kuberay-patches' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      ray_release_created: ${{ steps.release.outputs['patches/ray--release_created'] }}
      ray_tag_name: ${{ steps.release.outputs['patches/ray--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: [release-please]
    if: ${{ github.repository == 'boltz-bio/elastic-kueue-kuberay-patches' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"

      - name: Install Ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Install Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Patched Images to GHCR
        run: "mise run publish:kueue ::: publish:kuberay ::: publish:interlink"

  ray-wheels:
    needs: [release-please]
    if: ${{ github.repository == 'boltz-bio/elastic-kueue-kuberay-patches' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.release-please.outputs.ray_release_created == 'true') }}
    permissions:
      contents: write
    uses: ./.github/workflows/ray-wheels.yaml
    with:
      release-tag: ${{ needs.release-please.outputs.ray_tag_name }}

  # The images install the wheel of the Ray release, so a Ray release builds and publishes it first.
  publish-ray-images:
    needs: [release-please, ray-wheels]
    if: ${{ github.repository == 'boltz-bio/elastic-kueue-kuberay-patches' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (always() && needs.release-please.result == 'success' && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["success", "skipped"]'), needs.ray-wheels.result)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ray-images.yaml
    with:
      release-tag: ${{ needs.release-please.outputs.ray_tag_name }}
